# Modern Dark Theme for Streamlit Sentinel
[theme]
base = "dark"
primaryColor = "#00d2ff"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#131b2e"
codeBackgroundColor = "#131b2e"
textColor = "#e2e8f0"
linkColor = "#38bdf8"
borderColor = "#1e293b"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#0d1322"
secondaryBackgroundColor = "#131b2e"
borderColor = "#1e293b"
